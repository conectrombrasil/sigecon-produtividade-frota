    <div class="passo-desc">${ehApontador() ? 'Máquinas mobilizadas em '+esc(Repo.obra(rdo.obra_id)?.nome||'')+'.' : 'Máquinas vinculadas a você.'}</div>
    ${equips.length>6 ? `<label class="busca" style="margin-bottom:4px"><svg class="ic" style="width:19px;height:19px"><use href="#i-busca"/></svg>
      <input type="search" placeholder="Buscar por nome, prefixo ou placa" value="${esc(window._buscaEquip||'')}" oninput="window._buscaEquip=this.value;atualizarListaEquip()" enterkeyhint="search"/></label>` : ''}
    ${forns.length>1 && ehApontador() ? `<div class="filtros"><button class="chip-filtro ${!filtroForn?'ativo':''}" onclick="filtroForn='';renderRdo()">Todos os fornecedores</button>
      ${forns.map(f=>`<button class="chip-filtro ${filtroForn===f?'ativo':''}" onclick="filtroForn='${f}';renderRdo()">${esc(Repo.fornecedor(f).razao_social)}</button>`).join('')}</div>` : ''}
    <div id="lista-equip">${lista.length ? lista.map(e=>`<button class="card ${rdo.equipamento_id===e.id?'selecionado':''}" onclick="escolherEquip('${e.id}')">
      <div class="card-linha">${iconeEquip(e)}
        <div style="flex:1;min-width:0"><div class="card-titulo">${esc(e.descricao)}</div>
          <div class="card-sub">${esc(juntar(idEquip(e), Repo.fornecedor(e.fornecedor_id).razao_social, ehOperador() ? Repo.obra(e.obra_id)?.nome : ''))}</div></div>
        <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
          <span class="selo selo-neutro">${ehKm(e)?'Km':'Horas'}</span>${lancHoje.has(e.id)?`<span class="selo selo-enviado">Já lançada</span>`:''}</div>
      </div></button>`).join('') : '<div class="vazio">Nenhuma máquina com esse filtro.</div>'}</div>`;
}
function atualizarListaEquip(){
  const pos = document.activeElement?.selectionStart;
  renderRdo();
  const novo = document.querySelector('#rdo-corpo input[type=search]'); if (novo){ novo.focus(); try{ novo.setSelectionRange(pos,pos); }catch(e){} }
}
function aplicarMaquina(id){
  const mudou = rdo.equipamento_id !== id;
  const e = Repo.equipamento(id);
  rdo.equipamento_id = id; rdo.obra_id = e.obra_id;
  if (mudou) {
    rdo.horimetro_inicial = null; rdo.horimetro_final = null; sugerirMedidor();
    if (ehApontador() && e.operadores.length===1 && !rdo.operador) escolherOperadorVinculado(e.operadores[0].id, true);
  }
}
function escolherEquip(id){ aplicarMaquina(id); autosalvar(); irPasso(1); }
function sugerirMedidor(){
  const ult = Repo.ultimoMedidor(rdo.equipamento_id, rdo.data);
  if (ult && rdo.horimetro_inicial==null) rdo.horimetro_inicial = ult.valor;
}
function escolherOperadorVinculado(uid, silencioso){
  const e = Repo.equipamento(rdo.equipamento_id); const o = e?.operadores.find(x=>x.id===uid); if (!o) return;
  rdo.operador = o.nome; rdo.matricula = o.matricula || rdo.matricula; rdo.operador_usuario_id = o.id;
  if (!silencioso) { autosalvar(); renderRdo(); }
}

/* ---------- Passo 2: Dia ---------- */
function passoDia(){
  const e = Repo.equipamento(rdo.equipamento_id);
  const dup = Repo.doDia(rdo.equipamento_id, rdo.data, rdo.id);
  const dupSistema = !dup && Repo.doServidor(rdo.equipamento_id, rdo.data, rdo);
  const ult = Repo.ultimoMedidor(rdo.equipamento_id, rdo.data);
  const rot = rotuloMedidor(e), un = unidMedidor(e);
  const ini = rdo.horimetro_inicial, fim = rdo.horimetro_final;
  let ajudaMed = '';
  if (ini!=null && fim!=null && fim<ini) ajudaMed = `<div class="ajuda alerta">O final está menor que o inicial.</div>`;
  else if (ini!=null && fim!=null) ajudaMed = `<div class="ajuda">${fmtNum(fim-ini)} ${un} no dia.</div>`;
  else if (ult) ajudaMed = `<div class="ajuda">Último final lançado: ${fmtNum(ult.valor)} ${un} (${esc(fmtData(ult.data))}).</div>`;
  if (ini!=null && ult && ini<ult.valor) ajudaMed = `<div class="ajuda alerta">O inicial está menor que o último final lançado (${fmtNum(ult.valor)} ${un}, ${esc(fmtData(ult.data))}).</div>`;
  const ops = ehApontador() ? (e?.operadores||[]) : [];
  return resumoEquipHtml() + `
    ${dup ? `<div class="banner-duplicado"><b>Essa máquina já tem lançamento nesse dia.</b><br/>Abra o existente pra não lançar duas vezes, ou escolha outra data.
      <button class="btn btn-secundario" onclick="abrirRdo('${dup.id}')">Abrir o lançamento existente</button></div>` : ''}
    ${dupSistema ? `<div class="banner-duplicado"><b>Essa máquina já tem lançamento nesse dia no sistema.</b><br/>Foi feito pelo escritório. Escolha outra data, ou peça ao escritório pra corrigir o existente.</div>` : ''}
    <div class="campo"><span class="rotulo">Data *</span><input type="date" value="${rdo.data}" max="${hojeISO()}" onchange="rdo.data=this.value||hojeISO();sugerirMedidor();autosalvar();renderRdo()"/></div>
    ${ops.length ? `<span class="rotulo">Operadores desta máquina</span><div class="filtros" style="padding-top:0">${ops.map(o=>`<button class="chip-filtro ${rdo.operador_usuario_id===o.id?'ativo':''}" onclick="escolherOperadorVinculado('${o.id}')">👷 ${esc(o.nome)}</button>`).join('')}</div>` : ''}
    <div class="linha2">
      <div class="campo" style="flex:2"><span class="rotulo">Operador</span><input type="text" value="${esc(rdo.operador)}" ${ehOperador()?'disabled':''} autocomplete="off" autocapitalize="words" oninput="rdo.operador=this.value;rdo.operador_usuario_id=null;autosalvar()" onchange="renderRdo()"/></div>
      <div class="campo"><span class="rotulo">Matrícula</span><input type="text" inputmode="numeric" value="${esc(rdo.matricula)}" oninput="rdo.matricula=this.value;autosalvar()"/></div>
    </div>
    <div class="linha2">
      <div class="campo"><span class="rotulo">${rot} inicial (${un})</span><input type="text" inputmode="decimal" value="${numParaCampo(ini)}" onchange="rdo.horimetro_inicial=parseNum(this.value);autosalvar();renderRdo()"/></div>
      <div class="campo"><span class="rotulo">${rot} final (${un})</span><input type="text" inputmode="decimal" value="${numParaCampo(fim)}" placeholder="No fim do dia" onchange="rdo.horimetro_final=parseNum(this.value);autosalvar();renderRdo()"/></div>
    </div>
    ${ajudaMed}
    <div class="barra-acao"><button class="btn" ${dup||dupSistema?'disabled':''} onclick="irPasso(2)">Continuar para as horas</button></div>`;
}

/* ---------- Passo 3: Horas (seleciona as horas, depois diz o que fez) ---------- */
function celulaHtml(h){
  const k = HORAS[h], g = rdo.grade[k], sel = selecao.has(h);
  if (!g || !g.evento) return `<div class="hora ${sel?'sel':''}" data-h="${h}" role="button" aria-pressed="${sel}" aria-label="${intervalo(h)} vazia"><span class="h">${intervalo(h)}</span><span class="ev vazio-ev">—</span></div>`;
  const semAtv = g.evento==='Em Atividade' && (!g.atividade || !g.local);
  const txt = g.evento==='Em Atividade' && g.atividade ? g.atividade : g.evento;
  return `<div class="hora pintada ${sel?'sel':''} ${semAtv?'sem-ativ':''}" data-h="${h}" style="--c:${corEvento(g.evento)}" role="button" aria-pressed="${sel}" aria-label="${intervalo(h)} ${esc(g.evento)}">
    <span class="h">${intervalo(h)}</span><span class="ev">${esc(txt)}</span></div>`;
}
function passoHoras(){
  let regua = ''; for (let h=0; h<24; h++) regua += celulaHtml(h);
  return resumoEquipHtml() + `
    <div class="passo-titulo">Como foi o dia?</div>
    <div class="passo-desc">Toque nas horas (ou arraste o dedo por várias) e depois diga o que foi feito nelas.</div>
    <div class="atalhos">
      <button class="atalho" onclick="selecionarFaixa(7,16)">Selecionar 07h–17h</button>
      <button class="atalho" onclick="abrirIntervalo()">Escolher intervalo</button>
      <button class="atalho" onclick="copiarDiaAnterior()">Copiar dia anterior</button>
      <button class="atalho perigo" onclick="limparDia()">Limpar dia</button>
    </div>
    <div class="contagem" id="contagem"></div>
    <div class="regua" id="regua">${regua}</div>
    <div class="secao-titulo">Resumo do dia <span style="font-weight:500;color:var(--text3)">(toque pra selecionar)</span></div>
    <div id="trechos"></div>
    <div class="pincel" id="barra-sel"></div>`;
}
function renderBarraSel(){
  const b = document.getElementById('barra-sel'); if (!b) return;
  const n = selecao.size;
  if (!n) { b.innerHTML = `<div class="pincel-rot">Selecione as horas na grade acima.</div><button class="btn" onclick="irPasso(3)">Continuar</button>`; return; }
  const hs = [...selecao].sort((a,b)=>a-b);
  const faixas = []; let ini = hs[0], ant = hs[0];
  hs.slice(1).forEach(h=>{ if (h!==ant+1) { faixas.push(fmtFaixa(ini,ant)); ini = h; } ant = h; }); faixas.push(fmtFaixa(ini,ant));
  b.innerHTML = `<div class="pincel-rot"><b>${n} ${n>1?'horas selecionadas':'hora selecionada'}</b>: ${esc(faixas.join(', '))}</div>
    <div class="btn-linha"><button class="btn btn-secundario" onclick="selecao.clear();atualizarRegua()">Limpar</button><button class="btn" onclick="abrirOQueFoiFeito()">O que foi feito?</button></div>`;
}
function atualizarRegua(){
  const r = document.getElementById('regua'); if (!r) return;
  for (let h=0; h<24; h++) { const c = r.querySelector(`.hora[data-h="${h}"]`); if (c) c.outerHTML = celulaHtml(h); }
  atualizarResumoHoras(); renderBarraSel();
}
function atualizarResumoHoras(){
  const r = resumoGrade(rdo.grade);
  const c = document.getElementById('contagem');
  if (c) c.innerHTML = `<span><b>${r.apontadas}h</b> apontadas</span><span><b>${r.ativ}h</b> em atividade</span>${r.semAtividade?`<span style="color:var(--warn-txt)"><b style="color:inherit">${r.semAtividade}h</b> sem atividade ou local</span>`:''}`;
  const t = document.getElementById('trechos'); if (!t) return;
  const tr = trechos(rdo.grade);
  t.innerHTML = tr.length ? `<div class="trechos">${tr.map(x=>`<button class="trecho" style="--c:${corEvento(x.g.evento)}" onclick="selecionarFaixa(${x.de},${x.ate},true)">
    <span class="trecho-faixa"></span><span class="trecho-hora">${fmtFaixa(x.de,x.ate)}</span>
    <span class="trecho-txt">${esc(x.g.evento)}${x.g.evento==='Em Atividade'?`<small>${esc(x.g.atividade||'sem atividade')}, ${esc(x.g.local||'sem local')}</small>`:''}</span>
    <span class="trecho-dur">${x.ate-x.de+1}h</span></button>`).join('')}</div>`
    : `<div class="vazio" style="padding:20px">Nenhuma hora apontada ainda.</div>`;
}
function ligarRegua(){
  atualizarResumoHoras(); renderBarraSel();
  const regua = document.getElementById('regua'); if (!regua) return;
  let gesto = null;
  const horaEm = (x,y)=>{ const el = document.elementFromPoint(x,y)?.closest('.hora'); return el && regua.contains(el) ? +el.dataset.h : null; };
  // Arrastar seleciona (ou desmarca) do quadradinho inicial até o atual, em ordem de horário
  const aplicar = h=>{
    const antes = new Set(selecao);
    selecao = new Set(gesto.base);
    const de = Math.min(gesto.inicio, h), ate = Math.max(gesto.inicio, h);
    for (let i=de; i<=ate; i++) { if (gesto.adicionar) selecao.add(i); else selecao.delete(i); }
    for (let i=0; i<24; i++) if (antes.has(i)!==selecao.has(i)) { const c = regua.querySelector(`.hora[data-h="${i}"]`); if (c) c.outerHTML = celulaHtml(i); }
  };
  regua.addEventListener('pointerdown', ev=>{
    const h = horaEm(ev.clientX, ev.clientY); if (h==null) return;
    ev.preventDefault();
    gesto = { inicio:h, ultimo:h, adicionar: !selecao.has(h), base: new Set(selecao) };
    aplicar(h);
    try { regua.setPointerCapture(ev.pointerId); } catch(e){}
    if (navigator.vibrate) navigator.vibrate(6);
  });
  regua.addEventListener('pointermove', ev=>{
    if (!gesto) return;
    const h = horaEm(ev.clientX, ev.clientY); if (h==null || h===gesto.ultimo) return;
    gesto.ultimo = h; aplicar(h);
  });
  const fim = ()=>{ if (!gesto) return; gesto = null; renderBarraSel(); };
  regua.addEventListener('pointerup', fim); regua.addEventListener('pointercancel', fim);
}
function selecionarFaixa(de, ate, substituir){
  if (substituir) selecao.clear();
  for (let h=de; h<=ate; h++) selecao.add(h);
  atualizarRegua();
  if (substituir) document.getElementById('regua')?.scrollIntoView({ behavior:'smooth', block:'center' });
}
function abrirIntervalo(){
  const op = (sel)=>HORAS.map((k,h)=>`<option value="${h}" ${h===sel?'selected':''}>${k}</option>`).join('');
  const opFim = (sel)=>HORAS.map((k,h)=>`<option value="${h}" ${h===sel?'selected':''}>${String(h+1).padStart(2,'0')}h</option>`).join('');
  abrirModal('Selecionar intervalo', `
    <div class="linha2"><div class="campo"><span class="rotulo">Das</span><select id="int-de">${op(7)}</select></div>
    <div class="campo"><span class="rotulo">Até</span><select id="int-ate">${opFim(16)}</select></div></div>
    <div class="erro-msg" id="int-erro"></div>
    <button class="btn" onclick="confirmarIntervalo()">Selecionar</button>`);
}
function confirmarIntervalo(){
  const de = +document.getElementById('int-de').value, ate = +document.getElementById('int-ate').value;
  if (ate<de){ document.getElementById('int-erro').textContent = 'O fim não pode ser antes do início.'; return; }
  fecharModal(); selecionarFaixa(de, ate);
}
// Depois de selecionar: evento → (atividade → local) → aplica
function abrirOQueFoiFeito(){
  if (!selecao.size) return;
  const algumPintado = [...selecao].some(h=>rdo.grade[HORAS[h]]?.evento);
  let antes = '';
  if (ultimoApontamento) antes = `<button class="repetir" onclick="aplicarSelecao(ultimoApontamento)"><small>Repetir o último</small>${esc(ultimoApontamento.evento)}${ultimoApontamento.atividade?': '+esc(ultimoApontamento.atividade)+', '+esc(ultimoApontamento.local||''):''}</button>`;
  const ops = Repo.eventos().map(ev=>({ valor:ev.nome, rotulo:ev.nome, cor:ev.cor, manter: ev.nome==='Em Atividade' }));
  if (algumPintado) ops.push({ valor:'__remover', rotulo:'Remover o apontamento destas horas', ic:'🧽', perigo:true });
  escolherOpcao('O que foi feito nessas horas?', ops, v=>{
    if (v==='__remover') return aplicarSelecao(null);
    if (v!=='Em Atividade') return aplicarSelecao({ evento:v });
    escolherAtividade();
  }, antes);
}
function escolherAtividade(){
  const lista = Repo.atividades(rdo.obra_id);
  if (!lista.length) return aplicarSelecao({ evento:'Em Atividade', atividade:'', local:'' });
  escolherOpcao('Qual atividade?', lista.map(a=>({ valor:a.nome, rotulo:a.nome, manter:true, sel: ultimoApontamento?.atividade===a.nome })), atv=>escolherLocal(atv));
}
function escolherLocal(atv){
  const lista = Repo.locais(rdo.obra_id);
  if (!lista.length) return aplicarSelecao({ evento:'Em Atividade', atividade:atv, local:'' });

function verificacoes(r){
  r = r || rdo;
  const e = Repo.equipamento(r.equipamento_id), g = resumoGrade(r.grade), un = unidMedidor(e);
  const av = [];
  if (!g.apontadas) av.push({ txt:'Nenhuma hora apontada.', passo:2, bloqueia:true });
  if (Repo.doDia(r.equipamento_id, r.data, r.id)) av.push({ txt:'Já existe outro lançamento dessa máquina nesse dia.', passo:1, bloqueia:true });
  else if (Repo.doServidor(r.equipamento_id, r.data, r)) av.push({ txt:'Essa máquina já tem lançamento nesse dia no sistema.', passo:1, bloqueia:true });
  if (r.horimetro_inicial!=null && r.horimetro_final!=null && r.horimetro_final<r.horimetro_inicial) av.push({ txt:`${rotuloMedidor(e)} final menor que o inicial.`, passo:1, bloqueia:true });
  if (g.semAtividade) av.push({ txt:`${g.semAtividade}h em atividade sem atividade ou local definidos.`, passo:2 });
  if (g.buracos) av.push({ txt:`${g.buracos}h vazias no meio do dia, entre ${HORAS[g.prim]} e ${String(g.ult+1).padStart(2,'0')}h.`, passo:2 });
  if (r.horimetro_final==null) av.push({ txt:`${rotuloMedidor(e)} final não informado.`, passo:1 });
  if (!ehKm(e) && r.horimetro_inicial!=null && r.horimetro_final!=null){
    const d = r.horimetro_final - r.horimetro_inicial;
    if (Math.abs(d - g.ativ) > 1) av.push({ txt:`O horímetro marcou ${fmtNum(d)} h, mas foram apontadas ${g.ativ}h em atividade.`, passo:2 });
  }
  const ult = Repo.ultimoMedidor(r.equipamento_id, r.data);
  if (ult && r.horimetro_inicial!=null && r.horimetro_inicial<ult.valor) av.push({ txt:`Inicial menor que o último final lançado (${fmtNum(ult.valor)} ${un}).`, passo:1 });
  if (!r.operador) av.push({ txt:'Operador não informado.', passo:1 });
  return av;
}

class PadAssinatura {
  constructor(canvas){
    this.c = canvas; this.ctx = canvas.getContext('2d'); this.pontos = 0; this.largura = 0;
    this._ajustar();
    new ResizeObserver(()=>this._ajustar()).observe(canvas);
    let desenhando = false, ult = null;
    const pos = ev=>{ const r = this.c.getBoundingClientRect(); return { x:ev.clientX-r.left, y:ev.clientY-r.top }; };
    canvas.addEventListener('pointerdown', ev=>{
      ev.preventDefault(); desenhando = true; ult = pos(ev);
      try { canvas.setPointerCapture(ev.pointerId); } catch(e){}
      this.ctx.beginPath(); this.ctx.arc(ult.x, ult.y, 1.2, 0, Math.PI*2); this.ctx.fill(); this.pontos++;
    });
    canvas.addEventListener('pointermove', ev=>{
      if (!desenhando) return;
      for (const e of (ev.getCoalescedEvents ? ev.getCoalescedEvents() : [ev])) {
        const p = pos(e);
        this.ctx.beginPath(); this.ctx.moveTo(ult.x, ult.y); this.ctx.quadraticCurveTo(ult.x, ult.y, (ult.x+p.x)/2, (ult.y+p.y)/2); this.ctx.lineTo(p.x, p.y); this.ctx.stroke();
        ult = p; this.pontos++;
      }
    });
    const fim = ()=>{ if (!desenhando) return; desenhando = false; this.c.parentNode.classList.toggle('com-traco', this.pontos>0); };
    canvas.addEventListener('pointerup', fim); canvas.addEventListener('pointercancel', fim);
  }
  _ajustar(){
    const r = this.c.getBoundingClientRect();
    if (!r.width || Math.abs(r.width-this.largura)<1) return;
    const anterior = this.pontos ? this.c.toDataURL() : null, larguraAnt = this.largura;
    const dpr = Math.max(1, window.devicePixelRatio||1);
    this.largura = r.width; this.c.width = Math.round(r.width*dpr); this.c.height = Math.round(r.height*dpr);
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.ctx.fillStyle = '#fff'; this.ctx.fillRect(0,0,r.width,r.height);
    this.ctx.strokeStyle = '#0E1B2B'; this.ctx.fillStyle = '#0E1B2B'; this.ctx.lineWidth = 2.6; this.ctx.lineCap = 'round'; this.ctx.lineJoin = 'round';
    if (anterior) { const im = new Image(); im.onload = ()=>{ this.ctx.drawImage(im, 0, 0, r.width, r.height); this.ctx.fillStyle = '#0E1B2B'; }; im.src = anterior; }
  }
  limpar(){ this.pontos = 0; this.largura = 0; this._ajustar(); this.c.parentNode.classList.remove('com-traco'); }
  valida(){ return this.pontos >= 12; }
  imagem(){
    const f = Math.min(1, 600/this.c.width);
    const t = document.createElement('canvas'); t.width = Math.round(this.c.width*f); t.height = Math.round(this.c.height*f);
    const x = t.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,t.width,t.height); x.drawImage(this.c, 0, 0, t.width, t.height);
    return t.toDataURL('image/png');
  }
}
function conteudoCanonico(r){

  });
}
async function sha256(txt){
  if (!(window.crypto && crypto.subtle)) throw new Error('sem_crypto');
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function codigoCurto(hash){ return hash.slice(0,12).toUpperCase().match(/.{4}/g).join('-'); }
function pegarLocalizacao(){
  return new Promise(ok=>{
    if (!navigator.geolocation) return ok({ erro:'indisponível no aparelho' });
    navigator.geolocation.getCurrentPosition(
      p=>ok({ lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6), precisao_m:Math.round(p.coords.accuracy) }),
      e=>ok({ erro: e.code===1 ? 'não autorizada' : 'não obtida' }),
      { enableHighAccuracy:true, timeout:12000, maximumAge:120000 });
  });
}
// ---- Assinatura salva: cadastrada uma vez, aplicada em cada lançamento ----
const MinhaAssinatura = {
  chave(){ return 'assinatura_'+sessao.id; },
  async obter(){ return await BD.pegar('meta', this.chave()); },
  async carregarDoSistema(){
    const { data, error } = await sb.from('frota_assinatura_salva').select('imagem,consentimento_em,atualizado_em').eq('usuario_id', sessao.id).maybeSingle();
    if (error) return;
    const local = await this.obter();
    if (local && local.pendente) return this.enviar();          // a do celular ainda não subiu
    if (data) await BD.gravar('meta', data, this.chave());
  },
  async salvar(imagem){
    const agora = new Date().toISOString();

// Selfie em baixa resolução (~320px, JPEG): leve e suficiente pra reconhecer o rosto
function reduzirFoto(arquivo){
  return new Promise((ok, falha)=>{
    const url = URL.createObjectURL(arquivo), im = new Image();
    im.onload = ()=>{
      const max = 320, f = Math.min(1, max/Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width*f); c.height = Math.round(im.height*f);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.6));
    };
    im.onerror = ()=>{ URL.revokeObjectURL(url); falha(new Error('Não foi possível ler a foto.')); };
    im.src = url;
  });
}

  if (!op && r.fluxo==='aguardando_apontador' && !travado(r)) {

}

  };
  const tl = HORAS.map((k,h)=>{ const v = r.grade[k]; return `<div class="tl-c" style="background:${v&&v.evento?corEvento(v.evento):'#fff'}"><span>${String(h).padStart(2,'0')}</span></div>`; }).join('');
  const sig = (rot, s, extra, foto)=>`<div class="sig"><label>${rot}</label>${s ? `<div class="sig-img">${foto?`<img class="sig-selfie" src="${esc(foto)}" alt=""/>`:''}<img src="${s.imagem}" alt=""/></div><div class="sig-n">${esc(s.nome)}${s.matricula?' · '+esc(s.matricula):''}</div><div class="sig-t">${esc(fmtHoraCompleta(s.em))}${s.gps?.lat!=null?' · '+s.gps.lat+', '+s.gps.lng:''}<br/>Código ${esc(s.codigo)}</div>` : `<div class="sig-vazio">${esc(extra||'')}</div>`}</div>`;
  const html = `<div class="page">
    <div class="hdr"><div class="hdr-logo">REGISTRO<br>DIÁRIO DE<br>OPERAÇÃO</div>
      <div class="hdr-main"><div class="title">RDO — RELATÓRIO DIÁRIO DE OPERAÇÃO DE EQUIPAMENTO</div><div class="sub">${esc(o?.nome||'')}</div></div>
      <div class="hdr-right"><div><span class="lbl">Data</span>${P(fmtDataCurta(r.data))}</div><div><span class="lbl">Documento Nº</span>${P((a.apontador||a.operador)?.codigo || r.id.slice(0,8).toUpperCase())}</div></div></div>
    <div class="sec">1. Identificação do equipamento e operador</div>
    <div class="idb">
      <div class="idr"><div class="idc" style="flex:2.2"><span class="lbl">Tipo e modelo do equipamento</span>${P(e?.descricao)}</div><div class="idc"><span class="lbl">Código / Placa</span>${P(idEquip(e))}</div><div class="idc" style="flex:2"><span class="lbl">Fornecedor</span>${P(e ? Repo.fornecedor(e.fornecedor_id).razao_social : '')}</div></div>
      <div class="idr"><div class="idc" style="flex:2.5"><span class="lbl">Nome completo do operador / motorista</span>${P(r.operador)}</div><div class="idc"><span class="lbl">Matrícula</span>${P(r.matricula)}</div>
        <div class="idc"><span class="lbl">${rotuloMedidor(e)} inicial</span>${P(fmtNum(r.horimetro_inicial))}</div><div class="idc"><span class="lbl">${rotuloMedidor(e)} final</span>${P(fmtNum(r.horimetro_final))}</div>
        <div class="idc"><span class="lbl">${ehKm(e)?'Km rodados':'Horas no horímetro'}</span>${P(delta!=null?fmtNum(delta)+' '+un:'')}</div><div class="idc"><span class="lbl">Horas trabalhadas</span>${P(g.ativ+'h')}</div><div class="idc"><span class="lbl">Horas parado</span>${P((g.apontadas-g.ativ)+'h')}</div></div>
      <div class="idr"><div class="idc"><span class="lbl">Ocorrência / observação geral</span>${P(r.ocorrencia_geral)}</div></div>
    </div>
    <div class="sec">Linha do dia</div><div class="tl">${tl}</div>
    <div class="tl-leg">${Object.keys(g.porEvento).map(n=>`<span><i style="background:${corEvento(n)}"></i>${esc(n)} (${g.porEvento[n]}h)</span>`).join('')}</div>
    ${grade('Evento / estado do equipamento', Repo.eventos(), 'evento')}
    ${grade('Atividade executada', Repo.atividades(r.obra_id).concat([...new Set(Object.values(r.grade).map(x=>x.atividade).filter(Boolean))].filter(n=>!Repo.atividades(r.obra_id).some(a=>a.nome===n)).map(n=>({nome:n}))), 'atividade')}
    ${grade('Local / referência', Repo.locais(r.obra_id).concat([...new Set(Object.values(r.grade).map(x=>x.local).filter(Boolean))].filter(n=>!Repo.locais(r.obra_id).some(a=>a.nome===n)).map(n=>({nome:n}))), 'local')}
    <div class="rod">
      <div class="rodc"><div class="sec" style="margin-top:0">2. Quebra / manutenção / ocorrência</div>
        ${r.manutencoes.length ? `<table class="tg"><thead><tr><th>Descrição</th><th>Início</th><th>Fim</th><th>${rotuloMedidor(e)}</th></tr></thead><tbody>${r.manutencoes.map(m=>`<tr><td>${esc(m.descricao)}</td><td>${esc(m.hora_inicio||'—')}</td><td>${esc(m.hora_fim||'—')}</td><td>${fmtNum(m.horimetro_km)}</td></tr>`).join('')}</tbody></table>` : '<div class="nada">Nenhuma</div>'}</div>
      <div class="rodc"><div class="sec" style="margin-top:0">3. Abastecimento</div>
        ${r.abastecimentos.length ? `<table class="tg"><thead><tr><th>Hora</th><th>${rotuloMedidor(e)}</th><th>Litros</th><th>Combustível</th></tr></thead><tbody>${r.abastecimentos.map(x=>`<tr><td>${esc(x.hora||'—')}</td><td>${fmtNum(x.horimetro_km)}</td><td>${fmtNum(x.litros)}</td><td>${esc(x.combustivel||'')}</td></tr>`).join('')}</tbody></table>` : '<div class="nada">Nenhum</div>'}</div>
    </div>
    ${r.ajustes.length ? `<div class="sec">4. Acréscimos e descontos</div><table class="tg"><tbody>${r.ajustes.map(x=>`<tr><td>${x.tipo==='acrescimo'?'Acréscimo':'Desconto'}</td><td>${esc(x.descricao)}</td><td class="n">${fmtR$(x.valor)}</td></tr>`).join('')}</tbody></table>` : ''}
    <div class="sigs">
      ${sig('Operador / motorista', a.operador, a.recusa_operador ? 'Não assinou: '+a.recusa_operador.motivo : 'Aguardando assinatura', fotos.operador)}
      ${sig('Encarregado / fiscal de campo', a.apontador, 'Aguardando assinatura', fotos.apontador)}
      ${sig('Responsável técnico', null, '')}
    </div>
    <div class="ft"><span>RDO digital — SIGECON Produtividade da Frota${r.frota_rdo_id!=null?' · registro '+esc(r.frota_rdo_id):''}</span><span>Assinado eletronicamente no app de campo · verificação pelo código de conferência</span></div>
  </div>`;
  const el = document.getElementById('impressao'); el.innerHTML = html;
  document.title = 'RDO ' + juntar(idEquip(e)||e?.descricao, fmtDataCurta(r.data));
  // espera as imagens carregarem antes de abrir a impressão
  await Promise.all([...el.querySelectorAll('img')].map(im=>im.complete ? 0 : new Promise(ok=>{ im.onload = im.onerror = ok; setTimeout(ok, 4000); })));
  setTimeout(()=>{ window.print(); document.title = 'Produtividade da Frota'; }, 60);
}

/* ===================================================================== */
/* INSTALAÇÃO E ATUALIZAÇÃO (PWA)                                        */
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); promptInstalar = e; if (telaAtiva()==='tela-home') renderHome(); });
window.addEventListener('appinstalled', ()=>{ promptInstalar = null; toast('App instalado', 'sucesso'); if (telaAtiva()==='tela-home') renderHome(); });
async function instalarApp(){ if (!promptInstalar) return; promptInstalar.prompt(); await promptInstalar.userChoice; promptInstalar = null; renderHome(); }
let atualizandoApp = false;
function atualizarApp(){ if (swEsperando) { atualizandoApp = true; swEsperando.postMessage('pular'); } }
if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) {
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const vigiar = w=>w.addEventListener('statechange', ()=>{ if (w.state==='installed' && navigator.serviceWorker.controller) { swEsperando = w; if (telaAtiva()==='tela-home') renderHome(); } });
    if (reg.waiting && navigator.serviceWorker.controller) swEsperando = reg.waiting;
    if (reg.installing) vigiar(reg.installing);
    reg.addEventListener('updatefound', ()=>vigiar(reg.installing));
  }).catch(()=>{});
  // Recarrega só quando a pessoa pediu pra atualizar (não na primeira instalação)
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if (!atualizandoApp) return; atualizandoApp = false; location.reload(); });
}

iniciar();
</script>

</html>
