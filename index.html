    <div class="linha2"><div class="campo"><label class="rotulo">Ano</label><input id="ce-ano" inputmode="numeric" placeholder="2022"/></div><div class="campo"><label class="rotulo">Placa</label><input id="ce-placa" placeholder="ABC1D23" style="text-transform:uppercase"/></div></div>
    <div class="campo"><label class="rotulo">Nº de série / chassi</label><input id="ce-serie"/></div>
    <div class="erro-msg" id="ce-erro"></div>
    <button class="btn" onclick="salvarCadastroEquip()">Cadastrar e escolher</button>`);
}
function ceAtualizarPrefixo(){ const t = Repo.tipo(document.getElementById('ce-tipo').value); document.getElementById('ce-pref-base').value = t?.prefixo || ''; }
async function salvarCadastroEquip(){
  const g = id=>document.getElementById(id).value.trim(), erro = document.getElementById('ce-erro');
  const fid = g('ce-forn'), tid = g('ce-tipo');
  if (!fid) { erro.textContent = 'Escolha o fornecedor.'; return; }
  if (fid==='__outro' && !g('ce-forn-outro')) { erro.textContent = 'Escreva o nome do fornecedor.'; return; }
  if (!tid) { erro.textContent = 'Escolha o tipo do equipamento.'; return; }
  const t = Repo.tipo(tid), f = fid==='__outro' ? null : Repo.fornecedor(fid);
  const placa = g('ce-placa').toUpperCase(), serie = g('ce-serie');
  const dup = Repo.equipamentos().find(e=>(placa && (e.placa||'').toUpperCase().replace(/\W/g,'')===placa.replace(/\W/g,'')) || (serie && (e.numero_serie||'')===serie));
  if (dup && !confirm(`Já existe "${dup.descricao}" com essa ${placa && (dup.placa||'').toUpperCase().replace(/\W/g,'')===placa.replace(/\W/g,'') ? 'placa' : 'série'}.\n\nOK = cadastrar mesmo assim\nCancelar = voltar e escolher o que já existe`)) { fecharModal(); buscaEquip = placa || serie; renderVist(); return; }
  const marca = g('ce-marca'), modelo = g('ce-modelo');
  const prefixo = t?.prefixo && g('ce-pref-num') ? `${t.prefixo}-${g('ce-pref-num').padStart(2,'0')}` : '';
  const descricao = [t?.nome, marca, modelo].filter(Boolean).join(' ') + (placa ? ' — '+placa : serie ? ' — '+serie : '');
  const e = { id: uuid(), _novo: true, descricao, fornecedor_id: f?.id || null, fornecedor_nome: f?.razao_social || g('ce-forn-outro'), frota_tipo_id: tid, tipo: t?.categoria || 'outro',
    marca, modelo, ano: parseInt(g('ce-ano'))||null, placa, numero_serie: serie, prefixo, ativo: true,
    frota_tipos: { nome: t?.nome, categoria: t?.categoria, foto_url: t?.foto_url||null }, fornecedores: f ? { razao_social: f.razao_social } : null, criado_em: new Date().toISOString() };
  await Repo.salvarEquipNovo(e);
  fecharModal(); buscaEquip = ''; escolherEquip(e.id);
  toast('Equipamento cadastrado no celular', 'sucesso');
}

/* ---------- 2. Dados ---------- */
function paraCampoDataHora(iso){ const d = iso ? new Date(iso) : new Date(); const p = n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function passoDados(){
  if (!vist.data_vistoria) { vist.data_vistoria = new Date().toISOString(); autosalvar(); }
  const obras = Repo.obras();
  return `<div class="passo-titulo">Dados da vistoria</div>
    <div class="passo-desc">Confira a obra, a data e o local.</div>
    <label class="rotulo">Obra</label>
    <div class="campo"><select onchange="const o=Repo.obra(this.value);vist.obra_id=o?.id||null;vist.obra_nome=o?.nome||'';if(o)Prefs.set('obra',o.id);autosalvar()"><option value="">Sem obra definida</option>${obras.map(o=>`<option value="${o.id}" ${vist.obra_id===o.id?'selected':''}>${esc(o.nome)}</option>`).join('')}</select></div>
    <label class="rotulo">Data e hora</label>
    <div class="campo"><input type="datetime-local" value="${paraCampoDataHora(vist.data_vistoria)}" onchange="if(this.value){vist.data_vistoria=new Date(this.value).toISOString();autosalvar();}"/></div>
    <label class="rotulo">Local</label>
    <div class="campo"><input value="${esc(vist.local)}" placeholder="Ex.: pátio do canteiro, frente de serviço 2" oninput="vist.local=this.value;autosalvar()"/></div>
    <div class="campo" id="gps-linha">${gpsHtml()}</div>
    <div class="barra-acao"><button class="btn" onclick="irPasso(2)">Ir para o checklist</button></div>`;
}
function gpsHtml(){
  return vist.latitude!=null
    ? `<div class="ajuda" style="margin:0">📍 Localização: <b>${vist.latitude.toFixed(5)}, ${vist.longitude.toFixed(5)}</b>${vist.gps_precisao?` (±${Math.round(vist.gps_precisao)} m)`:''} <button class="link-obs" onclick="pegarGPS()">atualizar</button></div>`
    : `<button class="btn btn-secundario" onclick="pegarGPS()">📍 Pegar a localização do celular</button>`;
}
function pegarGPS(silencioso){
  if (!navigator.geolocation) { if (!silencioso) toast('Este celular não informa a localização.', 'erro'); return; }
  navigator.geolocation.getCurrentPosition(p=>{
    if (!vist) return;
    vist.latitude = p.coords.latitude; vist.longitude = p.coords.longitude; vist.gps_precisao = p.coords.accuracy; autosalvar();
    const el = document.getElementById('gps-linha'); if (el) el.innerHTML = gpsHtml();
  }, ()=>{ if (!silencioso) toast('Não deu pra pegar a localização. Verifique se o GPS está ligado e se o app tem permissão.', 'erro'); }, { enableHighAccuracy:true, timeout:20000, maximumAge:120000 });
}

/* ---------- 3. Checklist ---------- */
function rotulosSit(i){
  const des = vist.tipo==='desmobilizacao';
  if (i.tipo==='avaria') return [['nao', des?'✅ Nada novo':'✅ Não há','ok'], ['sim', des?'⚠️ Nova':'⚠️ Há','avaria'], ...(i.opc?[['na','➖ N/A','na']]:[])];
  return [['ok', des?'✅ Sem alteração':'✅ Bom','ok'], ['avaria', des?'⚠️ Nova avaria':'⚠️ Avaria','avaria'], ...(i.opc?[['na','➖ N/A','na']]:[])];
}
function itemCompleto(i, r){
  r = r || vist.resp[i.c];
  if (!r || !r.sit) return false;
  if (r.sit==='na' || r.sit==='nao') return true;
  if (i.tipo==='medidor' && r.valor==null) return false;
  if (!(r.fotos||[]).length) return false;
  if ((r.sit==='avaria' || r.sit==='sim') && !(r.obs||'').trim()) return false;
  return true;
}
function faltaNoItem(i){
  const r = vist.resp[i.c];
  if (!r || !r.sit) return 'falta marcar a situação';
  if (r.sit==='na' || r.sit==='nao') return '';
  if (i.tipo==='medidor' && r.valor==null) return 'falta a leitura';
  if (!(r.fotos||[]).length) return 'falta a foto';
  if ((r.sit==='avaria' || r.sit==='sim') && !(r.obs||'').trim()) return 'descreva a avaria';
  return '';
}
function progresso(v){
  const vv = v || vist; const salvo = vist; vist = vv;
  const feitos = ITENS.filter(i=>itemCompleto(i)).length; vist = salvo;
  return { feitos, total: ITENS.length };
}
function classeItem(i){ const r = vist.resp[i.c]; if (!r || !r.sit) return ''; if (r.sit==='na') return 'st-na'; if (!itemCompleto(i)) return 'falta-foto'; return (r.sit==='avaria'||r.sit==='sim') ? 'st-avaria' : 'st-ok'; }
function passoChecklist(){
  const p = progresso();
  return `<div class="progresso-geral"><div class="lin">Checklist <span>${p.feitos} de ${p.total} itens</span></div><div class="barra"><i style="width:${Math.round(p.feitos/p.total*100)}%"></i></div></div>
    <div id="secoes">${CHECKLIST.map(secaoHtml).join('')}</div>
    <div class="barra-acao"><button class="btn" onclick="irPasso(3)">Revisar</button></div>`;
}
function secaoHtml(s){
  const feitos = s.itens.filter(i=>itemCompleto(i)).length, av = s.itens.filter(i=>['avaria','sim'].includes(vist.resp[i.c]?.sit)).length;
  const aberta = secAberta===s.s;
  return `<div id="sec-${s.s}"><button class="sec-cab ${feitos===s.itens.length?'completa':''} ${av?'com-avaria':''} ${aberta?'aberta':''}" onclick="abrirSecao('${s.s}')">
      <span class="num">${feitos===s.itens.length?'✓':s.s}</span><span>${esc(s.t)}</span><span class="prog">${av?'⚠️ '+av+' · ':''}${feitos}/${s.itens.length}</span><svg class="ic" style="width:18px;height:18px;${aberta?'transform:rotate(180deg)':''}"><use href="#i-baixo"/></svg></button>
    ${aberta ? `<div class="sec-corpo">${s.itens.map(i=>itemHtml(Object.assign({ secao:s.s, secao_titulo:s.t }, i))).join('')}
      ${proximaSecao(s.s) ? `<button class="btn btn-secundario" onclick="abrirSecao('${proximaSecao(s.s)}', true)">Próxima: ${esc(CHECKLIST.find(x=>x.s===proximaSecao(s.s)).t)}</button>` : ''}</div>` : ''}</div>`;
}
function proximaSecao(s){ const k = CHECKLIST.findIndex(x=>x.s===s); return CHECKLIST[k+1]?.s || null; }
function abrirSecao(s, rolar){
  secAberta = secAberta===s && !rolar ? '' : s; autosalvar();
  document.getElementById('secoes').innerHTML = CHECKLIST.map(secaoHtml).join('');
  hidratarFotos(document.getElementById('secoes'));
  if (secAberta) setTimeout(()=>document.getElementById('sec-'+s)?.scrollIntoView({ behavior:'smooth', block:'start' }), 30);
}
function mobDoItem(c){
  if (vist.tipo!=='desmobilizacao' || !vist.vistoria_mob_id) return null;
  const local = Repo.vistoria(vist.vistoria_mob_id);
  if (local) { const r = local.resp[c]; return r ? { sit:r.sit, obs:r.obs, fotos:(r.fotos||[]).map(id=>({ id })) } : null; }
  const srv = Repo.servidor.find(s=>s.id===vist.vistoria_mob_id);
  const it = srv && (srv.itens||[]).find(x=>x.codigo===c);
  return it ? { sit:it.situacao, obs:it.obs, fotos:(it.fotos||[]).map(caminho=>({ caminho })) } : null;
}
function itemHtml(i){
  const r = vist.resp[i.c] || {}, des = vist.tipo==='desmobilizacao';
  const m = mobDoItem(i.c);
  const sitMob = m ? rvSituacao({ tipo:i.tipo, situacao:m.sit }, 'mobilizacao').t : '';
  const pedeFoto = r.sit && r.sit!=='na' && r.sit!=='nao';
  const nFotos = (r.fotos||[]).length;
  return `<div class="ck-item ${classeItem(i)}" id="it-${i.c.replace('.','-')}">
    <div class="ck-cab"><span class="ck-cod">${i.c}</span><div class="ck-tit">${esc(i.t)}${i.dica?`<small>${esc(i.dica)}</small>`:''}</div></div>
    ${m ? `<div class="ref-mob">${m.fotos.slice(0,2).map((f,k)=>`<div class="foto-th" ${f.id?`data-foto="${f.id}"`:`data-caminho="${esc(f.caminho)}"`} onclick="verFoto(this,'Mobilização · ${esc(i.t)}')"></div>`).join('')}<div style="flex:1">Na mobilização: <b>${esc(sitMob)}</b>${m.obs?`<br/>${esc(m.obs)}`:''}</div></div>` : (des && vist.vistoria_mob_id ? `<div class="ref-mob">Sem registro deste item na mobilização.</div>` : '')}
    ${i.tipo==='medidor' ? `<div class="medidor"><div class="campo"><input inputmode="decimal" placeholder="Leitura" value="${esc(numParaCampo(r.valor))}" ${r.sit==='na'?'disabled':''} oninput="setValor('${i.c}',this.value)"/></div><span class="un">${i.un}</span></div>` : ''}
    <div class="opcoes3">${rotulosSit(i).map(([k,l,cl])=>`<button class="${r.sit===k?'sel-'+cl:''}" onclick="setSit('${i.c}','${k}')">${l}</button>`).join('')}</div>
    ${i.texto && r.sit!=='na' ? `<div class="campo" style="margin:0 0 10px"><input placeholder="${esc(i.texto)} (se der pra ler)" value="${esc(r.texto||'')}" oninput="setTexto('${i.c}',this.value)" style="font-size:15px;font-weight:600"/></div>` : ''}
    ${pedeFoto || nFotos ? `<div class="fotos">${(r.fotos||[]).map((fid,k)=>`<div class="foto-th" data-foto="${fid}" onclick="verFoto(this,'${i.c} ${esc(i.t)}')"><span class="nub">${k+1}</span><button class="x" onclick="event.stopPropagation();removerFoto('${i.c}','${fid}')" aria-label="Apagar foto">×</button></div>`).join('')}
      ${pedeFoto && nFotos<CONFIG.FOTOS_POR_ITEM ? `<button class="btn-foto ${nFotos?'':'principal'}" onclick="tirarFoto('${i.c}')"><svg class="ic"><use href="#i-camera"/></svg>${nFotos?'+ Foto':'Tirar foto'}</button><button class="btn-galeria" onclick="tirarFoto('${i.c}',true)">da galeria</button>` : ''}</div>` : (!r.sit && i.tipo!=='avaria' ? `<div class="fotos"><button class="btn-foto principal" onclick="tirarFoto('${i.c}')"><svg class="ic"><use href="#i-camera"/></svg>Tirar foto</button><button class="btn-galeria" onclick="tirarFoto('${i.c}',true)">da galeria</button></div>` : '')}
    ${(r.sit==='avaria' || r.sit==='sim') ? `<div class="campo"><textarea placeholder="Descreva a avaria: onde, tamanho, como está *" oninput="setObs('${i.c}',this.value)">${esc(r.obs||'')}</textarea></div>`
      : r.sit && (r.obs || r._obsAberta) ? `<div class="campo"><textarea placeholder="Observação" oninput="setObs('${i.c}',this.value)">${esc(r.obs||'')}</textarea></div>`
      : r.sit ? `<button class="link-obs" onclick="abrirObs('${i.c}')">+ observação</button>` : ''}
    ${r.sit && faltaNoItem(i) ? `<div class="ajuda alerta" style="margin:8px 0 0">⚠️ ${faltaNoItem(i)}</div>` : ''}
  </div>`;
}
function rerenderItem(c){
  const el = document.getElementById('it-'+c.replace('.','-')); if (!el) return;
  const i = ITEM[c]; const tmp = document.createElement('div'); tmp.innerHTML = itemHtml(i); const novo = tmp.firstElementChild;
  el.replaceWith(novo); hidratarFotos(novo); atualizarCabecalhos();
}
function atualizarCabecalhos(){
  const p = progresso();
  const pg = document.querySelector('.progresso-geral'); if (pg) pg.outerHTML = `<div class="progresso-geral"><div class="lin">Checklist <span>${p.feitos} de ${p.total} itens</span></div><div class="barra"><i style="width:${Math.round(p.feitos/p.total*100)}%"></i></div></div>`;
  CHECKLIST.forEach(s=>{
    const cab = document.querySelector(`#sec-${s.s} > .sec-cab`); if (!cab) return;
    const feitos = s.itens.filter(i=>itemCompleto(i)).length, av = s.itens.filter(i=>['avaria','sim'].includes(vist.resp[i.c]?.sit)).length;
    cab.classList.toggle('completa', feitos===s.itens.length); cab.classList.toggle('com-avaria', !!av);
    cab.querySelector('.num').textContent = feitos===s.itens.length ? '✓' : s.s;
    cab.querySelector('.prog').textContent = (av?'⚠️ '+av+' · ':'') + feitos+'/'+s.itens.length;
  });
}
function resp(c){ return vist.resp[c] || (vist.resp[c] = { fotos: [] }); }
function setSit(c, sit){ const r = resp(c); r.sit = r.sit===sit ? null : sit; autosalvar(true); rerenderItem(c); }
function setValor(c, v){
  const r = resp(c), i = ITEM[c]; r.valor = parseNum(v); if (r.valor!=null && !r.sit) r.sit = 'ok';
  vist[i.campo] = r.sit==='na' ? null : r.valor; autosalvar();
  const el = document.getElementById('it-'+c.replace('.','-')); if (!el) return;
  el.className = 'ck-item '+classeItem(i);
  atualizarCabecalhos();
  if (r.sit && !el.querySelector('.opcoes3 .sel-ok,.opcoes3 .sel-avaria,.opcoes3 .sel-na')) rerenderItemSemFoco(c);
}
function rerenderItemSemFoco(c){ const ativo = document.activeElement; const pos = ativo?.selectionStart; rerenderItem(c); const inp = document.querySelector(`#it-${c.replace('.','-')} .medidor input`); if (inp) { inp.focus(); try { inp.setSelectionRange(pos, pos); } catch(e){} } }
function setTexto(c, v){ resp(c).texto = v; autosalvar(); }
function setObs(c, v){
  resp(c).obs = v; autosalvar();
  const i = ITEM[c], el = document.getElementById('it-'+c.replace('.','-')); if (el) el.className = 'ck-item '+classeItem(i);
  const av = el?.querySelector('.ajuda.alerta'); const f = faltaNoItem(i);
  if (av && !f) av.remove(); else if (av) av.textContent = '⚠️ '+f;
  atualizarCabecalhos();
}
function abrirObs(c){ resp(c)._obsAberta = true; rerenderItem(c); document.querySelector(`#it-${c.replace('.','-')} textarea`)?.focus(); }
function tirarFoto(c, galeria){ window._fotoAlvo = c; document.getElementById(galeria ? 'in-galeria' : 'in-camera').click(); }
async function fotoEscolhida(input){
  const c = window._fotoAlvo, arquivos = [...(input.files||[])]; input.value = '';
  if (!c || !arquivos.length || !vist) return;
  const i = ITEM[c], r = resp(c);
  const e = vist.equipamento || {};
  const leg1 = `${fmtDataHora(new Date().toISOString())} · ${[e.prefixo || e.placa, e.descricao].filter(Boolean).join(' · ')}`.slice(0, 110);
  const leg2 = `${vist.tipo==='desmobilizacao'?'Desmobilização':'Mobilização'} · ${c} ${i.t}${vist.latitude!=null?` · ${vist.latitude.toFixed(5)}, ${vist.longitude.toFixed(5)}`:''}`.slice(0, 120);
  let n = 0;
  for (const a of arquivos.slice(0, CONFIG.FOTOS_POR_ITEM - (r.fotos||[]).length)) {
    try {
      const blob = await prepararFoto(a, leg1, leg2);
      const id = uuid();
      await BD.gravar('fotos', { id, vistoria_id: vist.id, codigo: c, blob, bytes: blob.size, em: new Date().toISOString() });
      r.fotos = r.fotos || []; r.fotos.push(id); n++;
    } catch (err) { toast(err.message || 'Não foi possível usar essa foto.', 'erro'); }
  }
  if (n && !r.sit) r.sit = i.tipo==='avaria' ? 'sim' : 'ok';
  autosalvar(true); rerenderItem(c);
}
async function removerFoto(c, fid){
  if (!confirm('Apagar esta foto?')) return;
  const r = resp(c); r.fotos = (r.fotos||[]).filter(x=>x!==fid);
  await BD.apagar('fotos', fid).catch(()=>{});
  if (_urlFoto[fid]) { URL.revokeObjectURL(_urlFoto[fid]); delete _urlFoto[fid]; }
  autosalvar(true); rerenderItem(c);
}
async function hidratarFotos(raiz){
  const els = [...raiz.querySelectorAll('[data-foto],[data-caminho]')];
  const caminhos = els.map(el=>el.dataset.caminho).filter(Boolean);
  const assinada = caminhos.length ? await urlsAssinadas(caminhos) : ()=>null;
  for (const el of els) {
    const u = el.dataset.foto ? await urlFoto(el.dataset.foto) : assinada(el.dataset.caminho);
    if (u) { el.style.backgroundImage = `url("${u}")`; el.dataset.url = u; }
    else if (el.dataset.caminho) el.innerHTML = '<span class="nub" style="bottom:auto;top:4px">sem sinal</span>';
  }
}
function verFoto(el, cap){ if (el.dataset.url) abrirVisor(el.dataset.url, cap); }

/* ---------- 4. Revisão ---------- */
function passoRevisao(){
  const faltam = ITENS.filter(i=>!itemCompleto(i));
  const av = ITENS.filter(i=>['avaria','sim'].includes(vist.resp[i.c]?.sit));
  const na = ITENS.filter(i=>vist.resp[i.c]?.sit==='na');
  const des = vist.tipo==='desmobilizacao';
  return `<div class="passo-titulo">Revisão</div>
    <div class="numeros3"><div><b>${ITENS.length-faltam.length}</b><span>de ${ITENS.length} itens feitos</span></div><div><b style="color:var(--warn-txt)">${av.length}</b><span>${des?'novas avarias':'com avaria'}</span></div><div><b>${na.length}</b><span>não se aplica</span></div></div>
    ${faltam.length ? `<div class="lista-pend"><b>Faltam ${faltam.length} item${faltam.length>1?'s':''}:</b>${faltam.map(i=>`<button onclick="irParaItem('${i.c}')">• <b>${i.c}</b> ${esc(i.t)} — <span style="color:var(--text2)">${faltaNoItem(i)}</span></button>`).join('')}</div>` : `<div class="lista-ok">✓ Todos os itens do checklist foram feitos.</div>`}
    ${av.length ? `<div class="lista-av"><b>${des?'Novas avarias':'Avarias registradas'}:</b>${av.map(i=>`<div><b>${i.c}</b> ${esc(i.t)}${vist.resp[i.c].obs?' — '+esc(vist.resp[i.c].obs):''}</div>`).join('')}</div>` : ''}
    <label class="rotulo">Observações gerais (opcional)</label>
    <div class="campo"><textarea placeholder="Algo mais que deve constar no relatório" oninput="vist.observacoes=this.value;autosalvar()">${esc(vist.observacoes)}</textarea></div>
    <button class="btn btn-secundario" style="margin-bottom:8px" onclick="abrirRelatorio(vist.id, vist)">👁️ Ver prévia do relatório</button>
    <div class="barra-acao"><button class="btn" ${faltam.length?'disabled':''} onclick="irPasso(4)">${faltam.length?'Complete o checklist pra assinar':'Ir para as assinaturas'}</button></div>`;
}
function irParaItem(c){
  secAberta = ITEM[c].secao; passoAtual = 2; autosalvar(); renderVist();
  setTimeout(()=>{ const el = document.getElementById('it-'+c.replace('.','-')); if (el) { el.scrollIntoView({ behavior:'smooth', block:'center' }); el.style.boxShadow = '0 0 0 2px var(--orange)'; setTimeout(()=>el.style.boxShadow='', 1800); } }, 80);
}

/* ---------- 5. Assinaturas ---------- */
function passoAssinar(){
  const r = vist.rep;
  return `<div class="passo-titulo">Assinaturas</div>
    <div class="passo-desc">O vistoriador e o representante do fornecedor assinam no celular. Depois de concluir, a vistoria não pode mais ser alterada.</div>
    <div class="assin-card"><h4>Vistoriador</h4><div class="ajuda" style="margin:0 0 10px">${esc(vist.vistoriador_nome)} · Conectrom</div>
      ${vist.assin_vist ? `<div class="assin-feita"><img src="${vist.assin_vist.img}" alt=""/><button class="link-obs" onclick="vist.assin_vist=null;autosalvar();renderVist()">refazer</button></div>`
        : `<div class="pad-wrap"><canvas id="pad-vist" aria-label="Assinatura do vistoriador"></canvas><div class="pad-linha"></div><div class="pad-dica">Assine aqui com o dedo</div><button class="pad-limpar" onclick="window._padV.limpar()">Limpar</button></div>
           <button class="btn btn-secundario" style="margin-top:10px" onclick="confirmarAssin('vist')">Confirmar minha assinatura</button>`}
    </div>
    <div class="assin-card"><h4>Representante do fornecedor</h4><div class="ajuda" style="margin:0 0 10px">Operador ou responsável que entregou / recebeu o equipamento.</div>
      <label class="toggle-linha"><input type="checkbox" ${r.recusou?'checked':''} onchange="vist.rep.recusou=this.checked;if(this.checked)vist.rep.assin=null;autosalvar();renderVist()"/> Não está presente ou não quis assinar</label>
      <div class="campo"><input placeholder="Nome completo${r.recusou?'':' *'}" value="${esc(r.nome)}" oninput="vist.rep.nome=this.value;autosalvar()"/></div>
      ${r.recusou ? `<div class="campo"><textarea placeholder="Motivo *" oninput="vist.rep.motivo=this.value;autosalvar()">${esc(r.motivo)}</textarea></div>` : `
      <div class="linha2"><div class="campo"><input placeholder="CPF ou RG" value="${esc(r.documento)}" oninput="vist.rep.documento=this.value;autosalvar()"/></div><div class="campo"><input placeholder="Função" value="${esc(r.funcao)}" oninput="vist.rep.funcao=this.value;autosalvar()"/></div></div>
      <div class="campo"><input placeholder="Empresa" value="${esc(r.empresa)}" oninput="vist.rep.empresa=this.value;autosalvar()"/></div>
      ${r.assin ? `<div class="assin-feita"><img src="${r.assin.img}" alt=""/><button class="link-obs" onclick="vist.rep.assin=null;autosalvar();renderVist()">refazer</button></div>`
        : `<div class="pad-wrap"><canvas id="pad-rep" aria-label="Assinatura do representante"></canvas><div class="pad-linha"></div><div class="pad-dica">Assinatura do representante</div><button class="pad-limpar" onclick="window._padR.limpar()">Limpar</button></div>
           <button class="btn btn-secundario" style="margin-top:10px" onclick="confirmarAssin('rep')">Confirmar assinatura do representante</button>`}`}
    </div>
    <div class="erro-msg" id="assin-erro"></div>
    <div class="barra-acao"><button class="btn" id="btn-concluir" onclick="concluirVistoria()">Concluir vistoria</button></div>`;
}
function ligarPads(){
  const v = document.getElementById('pad-vist'), r = document.getElementById('pad-rep');
  window._padV = v ? new PadAssinatura(v) : null; window._padR = r ? new PadAssinatura(r) : null;
}
function confirmarAssin(quem){
  const pad = quem==='vist' ? window._padV : window._padR;
  if (!pad || !pad.valida()) { toast('A assinatura está muito curta. Assine de novo.', 'erro'); return; }
  if (quem==='rep' && !vist.rep.nome.trim()) { toast('Escreva o nome do representante antes.', 'erro'); return; }
  const a = { img: pad.imagem(), em: new Date().toISOString() };
  if (quem==='vist') vist.assin_vist = a; else vist.rep.assin = a;
  autosalvar(true); renderVist();
}
async function concluirVistoria(){
  const erro = document.getElementById('assin-erro'); erro.textContent = '';
  const faltam = ITENS.filter(i=>!itemCompleto(i));
  if (faltam.length) { erro.textContent = `Faltam ${faltam.length} itens no checklist.`; return; }
  if (!vist.assin_vist) { erro.textContent = 'Falta a assinatura do vistoriador (toque em "Confirmar minha assinatura").'; return; }
  const r = vist.rep;
  if (r.recusou) { if (!(r.motivo||'').trim()) { erro.textContent = 'Escreva o motivo de o representante não assinar.'; return; } }
  else { if (!r.nome.trim()) { erro.textContent = 'Escreva o nome do representante.'; return; } if (!r.assin) { erro.textContent = 'Falta a assinatura do representante (ou marque que ele não assinou).'; return; } }
  if (!confirm('Concluir a vistoria? Depois disso ela não pode mais ser alterada.')) return;
  vist.horimetro = vist.resp['1.3']?.sit==='na' ? null : (vist.resp['1.3']?.valor ?? null);
  vist.hodometro = vist.resp['1.4']?.sit==='na' ? null : (vist.resp['1.4']?.valor ?? null);
  if (!vist.equipamento.numero_serie && vist.resp['1.5']?.texto) vist.equipamento.numero_serie = vist.resp['1.5'].texto;
  vist.status = 'concluida'; vist.concluida_em = new Date().toISOString();
  clearTimeout(_autoT);
  await Repo.salvar(JSON.parse(JSON.stringify(vist)), true);
  const id = vist.id; vist = null;
  toast(online() ? 'Vistoria concluída. Enviando…' : 'Vistoria concluída. Sobe quando tiver internet.', 'sucesso');
  Sinc.rodar(true);
  history.replaceState({ve:1}, '');
  await abrirRelatorio(id);
}

/* =====================================================================
   RELATÓRIO
   ===================================================================== */
async function relDeLocal(v){
  const itens = [];
  for (const i of ITENS) {
    const r = v.resp[i.c]; if (!r || !r.sit) continue;
    const fotos = []; for (const f of (r.fotos||[])) { const u = await urlFoto(f); if (u) fotos.push(u); }
    itens.push({ codigo:i.c, secao:i.secao, secao_titulo:i.secao_titulo, titulo:i.t, tipo:i.tipo, situacao:r.sit, obs:r.obs, valor:r.valor, unidade:i.un, texto:r.texto, fotos });
  }
  return { id:v.id, tipo:v.tipo, data_vistoria:v.data_vistoria, local:v.local, latitude:v.latitude, longitude:v.longitude, obra_nome:v.obra_nome, equipamento:v.equipamento||{},
    horimetro: v.horimetro ?? (v.resp['1.3']?.sit!=='na' ? v.resp['1.3']?.valor : null), hodometro: v.hodometro ?? (v.resp['1.4']?.sit!=='na' ? v.resp['1.4']?.valor : null),
    itens, observacoes:v.observacoes, vistoriador_nome:v.vistoriador_nome,
    vistoriador_assinatura: v.assin_vist?.img || await urlAssinada(v.assin_vist?.caminho), vistoriador_em: v.assin_vist?.em,
    representante_nome:v.rep?.nome, representante_documento:v.rep?.documento, representante_funcao:v.rep?.funcao, representante_empresa:v.rep?.empresa,
    representante_assinatura: v.rep?.assin?.img || await urlAssinada(v.rep?.assin?.caminho), representante_em: v.rep?.assin?.em,
    representante_recusou: v.rep?.recusou, representante_motivo: v.rep?.motivo };
}
async function relDeServidor(s){
  const caminhos = []; (s.itens||[]).forEach(i=>(i.fotos||[]).forEach(c=>caminhos.push(c))); [s.vistoriador_assinatura, s.representante_assinatura].forEach(c=>c && caminhos.push(c));
  const u = await urlsAssinadas(caminhos);
  return Object.assign({}, s, { itens:(s.itens||[]).map(i=>Object.assign({}, i, { fotos:(i.fotos||[]).map(u).filter(Boolean) })), vistoriador_assinatura:u(s.vistoriador_assinatura), representante_assinatura:u(s.representante_assinatura) });
}
async function relatorioDe(id, rascunho){
  const local = rascunho || Repo.vistoria(id);
  if (local) return await relDeLocal(local);
  const s = Repo.servidor.find(x=>x.id===id);
  return s ? await relDeServidor(s) : null;
}
let _relId = null, _relDeVist = false;
async function abrirRelatorio(id, rascunho){
  _relDeVist = !!rascunho; _relId = id;
  mostrarTela('tela-relatorio');
  const folha = document.getElementById('rel-folha');
  folha.innerHTML = '<div style="padding:40px;text-align:center;color:#666"><span class="spinner"></span> Montando o relatório…</div>';
  try {
    const v = await relatorioDe(id, rascunho);
    if (!v) { folha.innerHTML = '<div style="padding:30px;color:#666">Vistoria não encontrada.</div>'; return; }
    const mobId = (rascunho || Repo.vistoria(id) || Repo.servidor.find(x=>x.id===id))?.vistoria_mob_id;
    const mob = v.tipo==='desmobilizacao' && mobId ? await relatorioDe(mobId).catch(()=>null) : null;
    const des = v.tipo==='desmobilizacao';
    document.getElementById('rel-titulo').textContent = des ? 'Relatório de desmobilização' : 'Relatório de mobilização';
    document.getElementById('rel-sub').textContent = v.equipamento?.descricao || '';
    const semFotoOffline = !online() && !Repo.vistoria(id);
    folha.innerHTML = (rascunho && rascunho.status!=='concluida' ? '<div style="background:#fff3d6;color:#7a5200;border-radius:6px;padding:8px 10px;margin-bottom:10px;font:600 12px Arial">Prévia — a vistoria ainda não foi concluída.</div>' : '')
      + (semFotoOffline ? '<div style="background:#fde2e2;color:#8a1f1f;border-radius:6px;padding:8px 10px;margin-bottom:10px;font:600 12px Arial">Sem internet: as fotos desta vistoria aparecem quando o sinal voltar.</div>' : '')
      + relatorioVistoriaHtml(v, mob);
    document.getElementById('rel-acoes').innerHTML = `<button class="btn btn-secundario" onclick="fecharRelatorio()">Voltar</button><button class="btn" onclick="imprimirRelatorio()">🖨️ Imprimir / PDF</button>`;
  } catch (e) { folha.innerHTML = `<div style="padding:30px;color:#a00">Não foi possível montar o relatório: ${esc(e.message||e)}</div>`; }
}
function imprimirRelatorio(){
  const html = document.getElementById('rel-folha').innerHTML;
  document.getElementById('impressao').innerHTML = html;
  const imgs = [...document.querySelectorAll('#impressao img')];
  Promise.all(imgs.map(im=>im.complete ? 1 : new Promise(ok=>{ im.onload = im.onerror = ok; setTimeout(ok, 4000); }))).then(()=>setTimeout(()=>window.print(), 80));
}
function fecharRelatorio(){
  if (_relDeVist && vist) { mostrarTela('tela-vist'); renderVist(); return; }
  mostrarTela('tela-home'); renderHome();
}

/* =====================================================================
   INSTALAR / ATUALIZAR
   ===================================================================== */
let promptInstalar = null, swEsperando = null, atualizandoApp = false;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); promptInstalar = e; if (telaAtiva()==='tela-home') renderHome(); });
window.addEventListener('appinstalled', ()=>{ promptInstalar = null; toast('App instalado', 'sucesso'); if (telaAtiva()==='tela-home') renderHome(); });
async function instalarApp(){
  if (!promptInstalar) { abrirModal('Instalar o app', `<div class="passo-desc"><b>Android (Chrome):</b> toque nos ⋮ do navegador e em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.<br/><br/><b>iPhone (Safari):</b> toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.</div><button class="btn" onclick="fecharModal()">Entendi</button>`); return; }
  promptInstalar.prompt(); try { await promptInstalar.userChoice; } catch (e) {} promptInstalar = null; renderHome();
}
function atualizarApp(){ if (!swEsperando) return location.reload(); atualizandoApp = true; swEsperando.postMessage('pular'); }
if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) {
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const vigiar = w=>w && w.addEventListener('statechange', ()=>{ if (w.state==='installed' && navigator.serviceWorker.controller) { swEsperando = w; if (telaAtiva()==='tela-home') renderHome(); } });
    if (reg.waiting && navigator.serviceWorker.controller) swEsperando = reg.waiting;
    if (reg.installing) vigiar(reg.installing);
    reg.addEventListener('updatefound', ()=>vigiar(reg.installing));
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if (!atualizandoApp) return; atualizandoApp = false; location.reload(); });
}

iniciar();
</script>
